name = "flip7"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Static assets — Shield WASM is served from /shield_wasm.js and /shield_wasm_bg.wasm
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "Flip7Room" },
  { name = "STATS", class_name = "Flip7Stats" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Flip7Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Flip7Stats"]
